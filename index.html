<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f5d211" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trak" />
    <meta
      name="description"
      content="Trak — turn your M-Pesa and Airtel Money messages into organized spending reports, income summaries, and financial insights."
    />
    <title>Trak · Mobile Money Spending Tracker</title>
    <script>
      // Capture the install prompt as early as possible so the in-app button
      // can offer "Install Trak" even if the event fires before React mounts.
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__trakInstallPrompt = e;
        window.dispatchEvent(new Event("trak-install-ready"));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
